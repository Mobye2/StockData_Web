<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{% block title %}台股分析系統{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    {% block extra_style %}{% endblock %}
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; display: flex; height: 100vh; }
        
        /* 左側選單 */
        .sidebar {
            width: 200px;
            background: #2c3e50;
            color: white;
            padding: 20px 0;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
        }
        .sidebar h2 {
            padding: 0 20px 20px;
            border-bottom: 1px solid #34495e;
            margin-bottom: 20px;
        }
        .menu-item {
            padding: 15px 20px;
            cursor: pointer;
            transition: background 0.3s;
            display: block;
            color: white;
            text-decoration: none;
        }
        .menu-item:hover {
            background: #34495e;
        }
        .menu-item.active {
            background: #1976d2;
            border-left: 4px solid #fff;
        }
        
        /* 主內容區 */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>台股分析</h2>
        <a href="/" class="menu-item {% if active_page == 'kline' %}active{% endif %}">📈 K線圖</a>
        <a href="/backtest" class="menu-item {% if active_page == 'backtest' %}active{% endif %}">🔄 回測系統</a>
        <a href="/multi-backtest" class="menu-item {% if active_page == 'multi_backtest' %}active{% endif %}">📊 多檔回測</a>
        <a href="/data-manager" class="menu-item {% if active_page == 'data_manager' %}active{% endif %}">🗄️ 資料管理</a>
    </div>
    
    <div class="main-content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
